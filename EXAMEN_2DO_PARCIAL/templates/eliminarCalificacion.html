<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Calificación</title>
</head>
<body>
    <div>
        <h1>Calificación a eliminar</h1>
        <form action="/eliminar/{{ Calif.0 }}" method="POST">
            <input type="text" name="txtAlumno" value="{{ Calif.1 }}">
            <input type="text" name="txtMatricula" value="{{ Calif.2 }}">
            <input type="text" name="txtMateria" value="{{ Calif.3 }}">
            <input type="number" name="txtCalificacion" value="{{ Calif.4 }}" step="0.1">
            <button type="submit" onclick="return Eliminar()">Eliminar</button>
            <button type="button" onclick="Regresar()">Regresar</button>
        </form>

        <script>
            function Eliminar() {
                return confirm("¿Estás seguro de que deseas eliminar esta calificación?");
            }
            function Regresar() {
                window.location.href = "{{ url_for('index') }}";
            }
        </script>
    </div>
</body>
</html>
